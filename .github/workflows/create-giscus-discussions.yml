name: Create giscus discussions

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: create-giscus-discussions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Create discussions for recent posts
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DISCUSSION_TOKEN }}
          script: |
            const createGiscusDiscussions = require('./scripts/create-giscus-discussions.js');
            await createGiscusDiscussions({ github, core });
